<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Lounge</title>
    <style>
        body {
            background-color: #F9BA40; /* Sanftes Orange */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #89259D; /* Dunkles Petrol */
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2.5em; /* Größerer Text */
            font-weight: bold; /* Fett */
        }
        h2 {
            color: #89259D; /* Sehr dunkles Blau */
            text-align: center;
            font-size: 1.5em;
            margin-top: 40px;
        }
        iframe {
            display: block;
            margin: 0 auto 20px;
            width: 90%; /* 10% Rand auf beiden Seiten */
            max-width: 1000px; /* Maximale Breite, damit die iFrames nicht zu groß werden */
            border: none;
        }
        @media (max-width: 768px) {
            header {
                font-size: 2.2em;
            }
            iframe {
                height: 500px;
            }
        }
    </style>
</head>
<body>
